<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071c58" />
  <meta name="description" content="교보문고 고객 대상 신용대출 서비스 제안 발표자료" />
  <title>교보문고 고객 대상 신용대출 서비스</title>
  <link rel="preload" as="image" href="slides/slide01.webp" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="deck" class="deck" aria-label="교보문고 고객 대상 신용대출 서비스 발표자료">
    <section class="slide" data-slide="1"><img src="slides/slide01.webp" alt="슬라이드 1: 표지" fetchpriority="high"></section>
    <section class="slide" data-slide="2"><img src="slides/slide02.webp" alt="슬라이드 2: 목차" loading="eager"></section>
    <section class="slide" data-slide="3"><img src="slides/slide03.webp" alt="슬라이드 3" loading="lazy"></section>
    <section class="slide" data-slide="4"><img src="slides/slide04.webp" alt="슬라이드 4" loading="lazy"></section>
    <section class="slide" data-slide="5"><img src="slides/slide05.webp" alt="슬라이드 5" loading="lazy"></section>
    <section class="slide" data-slide="6"><img src="slides/slide06.webp" alt="슬라이드 6" loading="lazy"></section>
    <section class="slide" data-slide="7"><img src="slides/slide07.webp" alt="슬라이드 7" loading="lazy"></section>
    <section class="slide" data-slide="8"><img src="slides/slide08.webp" alt="슬라이드 8" loading="lazy"></section>
    <section class="slide" data-slide="9"><img src="slides/slide09.webp" alt="슬라이드 9" loading="lazy"></section>
    <section class="slide" data-slide="10"><img src="slides/slide10.webp" alt="슬라이드 10" loading="lazy"></section>
    <section class="slide" data-slide="11"><img src="slides/slide11.webp" alt="슬라이드 11" loading="lazy"></section>
    <section class="slide" data-slide="12"><img src="slides/slide12.webp" alt="슬라이드 12" loading="lazy"></section>
    <section class="slide" data-slide="13"><img src="slides/slide13.webp" alt="슬라이드 13" loading="lazy"></section>
    <section class="slide" data-slide="14"><img src="slides/slide14.webp" alt="슬라이드 14" loading="lazy"></section>
    <section class="slide" data-slide="15"><img src="slides/slide15.webp" alt="슬라이드 15" loading="lazy"></section>
    <section class="slide" data-slide="16"><img src="slides/slide16.webp" alt="슬라이드 16" loading="lazy"></section>
    <section class="slide" data-slide="17"><img src="slides/slide17.webp" alt="슬라이드 17: 정리" loading="lazy"></section>
    <section class="slide" data-slide="18"><img src="slides/slide18.webp" alt="슬라이드 18: 감사합니다" loading="lazy"></section>
    <section class="slide" data-slide="19"><img src="slides/slide19.webp" alt="슬라이드 19: 참고자료" loading="lazy"></section>
  </main>

  <div class="topbar" aria-hidden="true">
    <div class="progress"><span id="progressFill"></span></div>
  </div>

  <nav class="controls" aria-label="슬라이드 이동">
    <button id="prevBtn" class="icon-btn" type="button" aria-label="이전 슬라이드">←</button>
    <div id="counter" class="counter" aria-live="polite">1 / 19</div>
    <button id="nextBtn" class="icon-btn" type="button" aria-label="다음 슬라이드">→</button>
    <button id="fullscreenBtn" class="icon-btn fullscreen-btn" type="button" aria-label="전체화면">⛶</button>
  </nav>

  <div class="hint" id="hint">스크롤 · ← → · 스와이프로 이동</div>
  <script src="script.js"></script>
</body>
</html>
